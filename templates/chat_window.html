{% extends "base.html" %}
{% block title %}Чат{% endblock %}

{% block content %}
<style>
.chat-toggle-wrap { position: fixed; bottom: 26px; right: 26px; z-index: 1990; }
.chat-toggle {
  width: 64px; height: 64px; border: none; border-radius: 24px; cursor: pointer;
  background: linear-gradient(135deg, #2d5cf6, #6c63ff); color: #fff; font-size: 28px;
  box-shadow: 0 20px 34px rgba(45, 92, 246, 0.34);
  display: flex; align-items: center; justify-content: center;
}
.toggle-badge {
  position:absolute; top:-4px; right:-4px; min-width:22px; padding:2px 7px; border-radius:999px;
  background:#ef4444; color:#fff; border:2px solid #fff; font-size:11px; font-weight:800; text-align:center; display:none;
}
.chat-widget {
  position: fixed; bottom: 106px; right: 24px; width: 360px; height: 540px; display: none; flex-direction: column;
  overflow: hidden; z-index: 2000; border-radius: 28px; background: rgba(255,255,255,.96);
  border: 1px solid rgba(214,227,243,.95); box-shadow: 0 28px 70px rgba(15,23,42,.22); backdrop-filter: blur(10px);
}
.chat-header {
  padding: 18px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  background: linear-gradient(135deg, #172554, #2449b1); color:#fff; cursor:pointer;
}
.chat-header-main { display:flex; align-items:center; gap:12px; min-width:0; }
.chat-avatar {
  width: 46px; height: 46px; border-radius: 16px; background: linear-gradient(135deg, #4d83ff, #6d68ff);
  display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; box-shadow: 0 12px 24px rgba(77,131,255,.24);
}
.chat-title strong { display:block; font-size:18px; }
.chat-title span { display:block; margin-top:4px; font-size:12px; color:rgba(226,237,255,.78); }
.chat-close { font-size:18px; color:rgba(255,255,255,.7); }
.widget-messages {
  flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px;
  background: radial-gradient(circle at top right, rgba(77,131,255,.08), transparent 28%), linear-gradient(180deg, rgba(248,250,255,.9), rgba(255,255,255,.98));
}
.widget-placeholder {
  margin: 20px auto 0; padding: 9px 14px; border-radius: 999px; background: rgba(148,163,184,.12);
  color:#64748b; font-size:12px; font-weight:800;
}
.message { max-width: 82%; padding: 12px 14px; border-radius: 20px; font-size: 14px; line-height: 1.6; animation: widgetMsgIn .2s ease; box-shadow: 0 14px 24px rgba(15,23,42,.06); }
@keyframes widgetMsgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.message.mine { align-self:flex-end; background: linear-gradient(135deg,#2d5cf6,#6c63ff); color:#fff; border-bottom-right-radius:8px; }
.message.other { align-self:flex-start; background:#fff; color:#1e293b; border:1px solid rgba(214,227,243,.95); border-bottom-left-radius:8px; }
.message .msg-sender { margin-bottom:6px; font-size:11px; font-weight:800; color:#64748b; }
.message .msg-ts { margin-top:6px; font-size:10px; font-weight:700; opacity:.7; text-align:right; }
.chat-input {
  padding: 16px; display:flex; gap:10px; align-items:flex-end; border-top:1px solid rgba(214,227,243,.95);
  background: linear-gradient(180deg, #fff, #f8fbff);
}
.chat-input textarea {
  flex:1; min-height:50px; max-height:120px; resize:none; padding:13px 15px; border:1.5px solid #dbe5f3; border-radius:18px;
  background:#f8fafc; font:inherit; outline:none; transition:border .2s, box-shadow .2s, background .2s;
}
.chat-input textarea:focus { border-color:#4d83ff; background:#fff; box-shadow:0 0 0 4px rgba(77,131,255,.12); }
.chat-input button {
  min-width:54px; height:54px; border:none; border-radius:20px; cursor:pointer;
  background: linear-gradient(135deg,#2d5cf6,#6c63ff); color:#fff; font-size:20px;
  box-shadow: 0 16px 30px rgba(45,92,246,.24);
}
.chat-toast {
  position: fixed; right: 102px; bottom: 118px; max-width: 260px; padding: 12px 14px; border-radius: 18px;
  background: rgba(18, 28, 58, 0.96); color:#fff; border:1px solid rgba(148,163,184,.22); box-shadow:0 24px 44px rgba(15,23,42,.34);
  z-index: 9999; cursor: pointer; animation: toastIn .3s ease;
}
.chat-toast strong { display:block; color:#b9d1ff; font-size:12px; font-weight:800; }
.chat-toast span { display:block; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13px; }
@keyframes toastIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
@media (max-width: 640px) {
  .chat-toggle-wrap { right: 16px; bottom: 20px; }
  .chat-widget { right: 12px; left: 12px; width: auto; bottom: 98px; height: 68vh; }
  .chat-toast { right: 18px; left: 18px; max-width: none; bottom: 108px; }
}
</style>

<div class="chat-toggle-wrap">
  <button class="chat-toggle" id="chatToggle" onclick="toggleChat()" title="Отвори чат">💬</button>
  <span class="toggle-badge" id="toggleBadge"></span>
</div>

<div class="chat-widget" id="chatWidget">
  <div class="chat-header" onclick="toggleChat()">
    <div class="chat-header-main">
      <div class="chat-avatar">#</div>
      <div class="chat-title">
        <strong>Општ чат</strong>
        <span>Брза комуникација со целиот тим</span>
      </div>
    </div>
    <div class="chat-close">✕</div>
  </div>
  <div class="widget-messages" id="messages">
    <div class="widget-placeholder">Пораките ќе се појават тука.</div>
  </div>
  <div class="chat-input">
    <textarea id="msgInput" placeholder="Напиши порака..." oninput="autoResizeWidget(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
const WIDGET_ROOM_ID = {{ global_room_id }};
const WIDGET_ME = {{ me|tojson }};
let widgetLastId = 0;
let widgetPoll = null;
let widgetOpen = false;

function toggleChat() {
  const widget = document.getElementById("chatWidget");
  widgetOpen = !widgetOpen;
  widget.style.display = widgetOpen ? "flex" : "none";
  if (widgetOpen) {
    document.getElementById("toggleBadge").style.display = "none";
    loadWidgetHistory();
    startWidgetPoll();
  } else {
    stopWidgetPoll();
  }
}

function loadWidgetHistory() {
  fetch(`/chat/history?room_id=${WIDGET_ROOM_ID}`)
    .then((r) => r.json())
    .then((data) => {
      const area = document.getElementById("messages");
      area.innerHTML = "";
      widgetLastId = 0;
      if (!data.messages || data.messages.length === 0) {
        area.innerHTML = '<div class="widget-placeholder">Нема пораки уште. Почни разговор.</div>';
      } else {
        data.messages.forEach((message) => appendWidgetMessage(message));
        widgetLastId = data.messages[data.messages.length - 1].id;
        scrollWidgetToBottom();
      }
    });
}

function pollWidgetMessages() {
  fetch(`/chat/messages?room_id=${WIDGET_ROOM_ID}&after=${widgetLastId}`)
    .then((r) => r.json())
    .then((data) => {
      if (data.messages && data.messages.length) {
        const area = document.getElementById("messages");
        const placeholder = area.querySelector(".widget-placeholder");
        if (placeholder) placeholder.remove();
        data.messages.forEach((message) => appendWidgetMessage(message));
        widgetLastId = data.messages[data.messages.length - 1].id;
        scrollWidgetToBottom();
      }
    });
}

function appendWidgetMessage(message) {
  const area = document.getElementById("messages");
  const isMine = message.sender === WIDGET_ME;
  const div = document.createElement("div");
  div.className = `message ${isMine ? "mine" : "other"}`;
  div.innerHTML = `${!isMine ? `<div class="msg-sender">${escHtml(message.sender)}</div>` : ""}${escHtml(message.text)}<div class="msg-ts">${message.ts || ""}</div>`;
  area.appendChild(div);
}

function sendMsg() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  autoResizeWidget(input);
  fetch("/chat/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ room_id: WIDGET_ROOM_ID, text })
  })
    .then((r) => r.json())
    .then((data) => {
      if (data.ok) {
        const area = document.getElementById("messages");
        const placeholder = area.querySelector(".widget-placeholder");
        if (placeholder) placeholder.remove();
        appendWidgetMessage({ sender: WIDGET_ME, text, ts: data.ts || "" });
        widgetLastId = Math.max(widgetLastId, data.message_id || 0);
        scrollWidgetToBottom();
      }
    });
}

function startWidgetPoll() {
  stopWidgetPoll();
  widgetPoll = setInterval(pollWidgetMessages, 3000);
}

function stopWidgetPoll() {
  if (widgetPoll) {
    clearInterval(widgetPoll);
    widgetPoll = null;
  }
}

function scrollWidgetToBottom() {
  const area = document.getElementById("messages");
  area.scrollTop = area.scrollHeight;
}

function autoResizeWidget(el) {
  el.style.height = "auto";
  el.style.height = `${Math.min(el.scrollHeight, 120)}px`;
}

setInterval(() => {
  if (widgetOpen) return;
  fetch("/chat/unread")
    .then((r) => r.json())
    .then((data) => {
      const total = data.total || 0;
      const badge = document.getElementById("toggleBadge");
      badge.textContent = total;
      badge.style.display = total > 0 ? "inline" : "none";
      const navBadge = document.getElementById("chatNavBadge");
      if (navBadge) {
        navBadge.textContent = total;
        navBadge.style.display = total > 0 ? "inline" : "none";
      }
    });
}, 5000);

function escHtml(str) {
  if (!str) return "";
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
</script>
{% endblock %}
