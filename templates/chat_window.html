{% extends "base.html" %}
{% block title %}Чат{% endblock %}

{% block content %}
<style>
.chat-widget {
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 340px;
    height: 480px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 2000;
    border: 1px solid #e2e8f0;
}

.chat-header {
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: white;
    padding: 12px 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: #f8fafc;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.message {
    max-width: 80%;
    padding: 9px 13px;
    border-radius: 18px;
    font-size: 14.5px;
    animation: msgIn .2s ease;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.message.mine {
    align-self: flex-end;
    background: linear-gradient(135deg,#3b82f6,#6366f1);
    color: white;
    border-bottom-right-radius: 4px;
}

.message.other {
    align-self: flex-start;
    background: #e2e8f0;
    color: #1e293b;
    border-bottom-left-radius: 4px;
}

.message .msg-sender {
    font-size: 10px;
    font-weight: 700;
    opacity: 0.75;
    margin-bottom: 2px;
}

.message .msg-ts {
    font-size: 10px;
    opacity: 0.65;
    margin-top: 3px;
    text-align: right;
}

.chat-input {
    padding: 12px;
    background: white;
    border-top: 1px solid #e2e8f0;
    display: flex;
    gap: 8px;
}

.chat-input textarea {
    flex: 1;
    resize: none;
    height: 42px;
    padding: 10px 14px;
    border: 1.5px solid #cbd5e1;
    border-radius: 12px;
    font-size: 13px;
    outline: none;
    font-family: inherit;
    transition: border .2s;
}
.chat-input textarea:focus { border-color: #3b82f6; }

.chat-input button {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg,#3b82f6,#6366f1);
    color: white;
    border: none;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    transition: transform .15s;
}
.chat-input button:hover { transform: scale(1.08); }

.chat-toggle {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: white;
    border: none;
    border-radius: 50%;
    font-size: 28px;
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    cursor: pointer;
    z-index: 1990;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Unread badge on toggle button */
.toggle-badge {
    position: absolute;
    top: -4px; right: -4px;
    background: #ef4444;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    border-radius: 999px;
    padding: 2px 6px;
    min-width: 18px;
    text-align: center;
    border: 2px solid #fff;
    display: none;
}

/* In-app toast */
.chat-toast {
    position: fixed;
    bottom: 100px;
    right: 90px;
    background: #1e293b;
    color: #fff;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px;
    box-shadow: 0 6px 24px rgba(0,0,0,.2);
    z-index: 9999;
    border-left: 4px solid #3b82f6;
    cursor: pointer;
    max-width: 240px;
    animation: toastIn .3s ease;
}
.chat-toast strong { display: block; color: #93c5fd; font-size: 12px; }
.chat-toast span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@keyframes toastIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
}
</style>

<div style="position:relative; display:inline-block;">
    <button class="chat-toggle" id="chatToggle" onclick="toggleChat()" title="Отвори чат">💬</button>
    <span class="toggle-badge" id="toggleBadge"></span>
</div>

<div class="chat-widget" id="chatWidget">
    <div class="chat-header" onclick="toggleChat()">
        <span>💬 Општ чат</span>
        <span onclick="event.stopImmediatePropagation(); toggleChat()">✕</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="chat-input">
        <textarea id="msgInput" placeholder="Напиши порака..."
                  onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
        <button onclick="sendMsg()">➤</button>
    </div>
</div>

<script>
const WIDGET_ROOM_ID = {{ global_room_id }};
const WIDGET_ME = {{ me|tojson }};
let widgetLastId = 0;
let widgetPoll = null;
let widgetOpen = false;

function toggleChat() {
    const w = document.getElementById("chatWidget");
    widgetOpen = !widgetOpen;
    w.style.display = widgetOpen ? "flex" : "none";
    if (widgetOpen) {
        loadWidgetMessages();
        startWidgetPoll();
        // Clear badge
        document.getElementById("toggleBadge").style.display = "none";
    } else {
        stopWidgetPoll();
    }
}

function loadWidgetMessages() {
    fetch(`/chat/messages?room_id=${WIDGET_ROOM_ID}&after=${widgetLastId}`)
        .then(r => r.json())
        .then(data => {
            const area = document.getElementById("messages");
            (data.messages || []).forEach(m => {
                const div = document.createElement("div");
                div.className = "message " + (m.sender === WIDGET_ME ? "mine" : "other");
                div.innerHTML = (m.sender !== WIDGET_ME ? `<div class="msg-sender">${escHtml(m.sender)}</div>` : "") +
                    escHtml(m.text) +
                    `<div class="msg-ts">${m.ts}</div>`;
                area.appendChild(div);
                widgetLastId = Math.max(widgetLastId, m.id);
            });
            area.scrollTop = area.scrollHeight;
        });
}

function sendMsg() {
    const input = document.getElementById("msgInput");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";

    fetch("/chat/send", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({room_id: WIDGET_ROOM_ID, text})
    }).then(() => loadWidgetMessages());
}

function startWidgetPoll() {
    stopWidgetPoll();
    widgetPoll = setInterval(loadWidgetMessages, 3000);
}

function stopWidgetPoll() {
    if (widgetPoll) { clearInterval(widgetPoll); widgetPoll = null; }
}

// Badge polling when widget is closed
setInterval(() => {
    if (widgetOpen) return;
    fetch("/chat/unread")
        .then(r => r.json())
        .then(data => {
            const total = data.total || 0;
            const badge = document.getElementById("toggleBadge");
            badge.textContent = total;
            badge.style.display = total > 0 ? "inline" : "none";

            // Nav badge
            const navBadge = document.getElementById("chatNavBadge");
            if (navBadge) {
                navBadge.textContent = total;
                navBadge.style.display = total > 0 ? "inline" : "none";
            }
        });
}, 5000);

// Load initial messages
setTimeout(loadWidgetMessages, 300);

function escHtml(str) {
    if (!str) return "";
    return String(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}
</script>
{% endblock %}
