{% extends "base.html" %}

{% block title %}Nov sostanok - Fersedo{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="fw-bold mb-4">Nov sostanok</h1>

    <div class="card shadow-lg border-0">
        <div class="card-body p-5">
            <form method="POST" enctype="multipart/form-data" id="sostanokForm">
                <div class="mb-4">
                    <label for="naslov" class="form-label fw-bold">Naslov na sostanokot *</label>
                    <input type="text" class="form-control form-control-lg" id="naslov" name="naslov" required placeholder="Pr. Sostanok za proizvodstvo - 15.03.2026">
                </div>

                <div class="mb-4">
                    <label for="ucesnici" class="form-label fw-bold">Ucesnici</label>
                    <input type="text" class="form-control" id="ucesnici" name="ucesnici" placeholder="Ime1, Ime2, Ime3...">
                    <small class="text-muted">Razdeli so zapirka</small>
                </div>

                <div class="mb-5">
                    <label class="form-label fw-bold">Snimi ili prikachi audio</label>
                    <div class="d-flex gap-3 flex-wrap">
                        <button type="button" class="btn btn-outline-danger btn-lg px-5 py-3" id="startRecordBtn">
                            <i class="fas fa-microphone fa-2x me-2"></i> Pochni snimanje
                        </button>

                        <div class="position-relative">
                            <input type="file" class="form-control form-control-lg" id="audioFile" name="audio" accept="audio/*">
                            <small class="text-muted">Ili prikachi postojechka snimka (mp3, wav, m4a...)</small>
                        </div>
                    </div>

                    <div id="recordingStatus" class="mt-3 d-none">
                        <div class="alert alert-warning d-flex align-items-center">
                            <i class="fas fa-circle-notch fa-spin me-3 fa-2x"></i>
                            <span>Snimanje vo tek... <span id="timer">00:00</span></span>
                        </div>
                        <button type="button" class="btn btn-danger mt-2" id="stopRecordBtn">Zapri i zachuvaj</button>
                    </div>

                    <audio id="audioPreview" controls class="mt-3 w-100 d-none"></audio>
                    <div id="recordedLabel" class="mt-2 d-none">
                        <span class="badge bg-success fs-6"><i class="fas fa-check me-1"></i> Snimkata e podgotvena za zachuvuvanje</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg px-5 py-3" id="submitBtn">
                    <i class="fas fa-save me-2"></i> Zachuvaj i procesiraj so AI
                </button>
            </form>
        </div>
    </div>
</div>

<script>
const startBtn = document.getElementById('startRecordBtn');
const stopBtn = document.getElementById('stopRecordBtn');
const statusDiv = document.getElementById('recordingStatus');
const timerSpan = document.getElementById('timer');
const audioPreview = document.getElementById('audioPreview');
const audioFileInput = document.getElementById('audioFile');
const recordedLabel = document.getElementById('recordedLabel');
const form = document.getElementById('sostanokForm');
const submitBtn = document.getElementById('submitBtn');

let mediaRecorder;
let audioChunks = [];
let timerInterval;
let seconds = 0;

startBtn.addEventListener('click', async () => {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

        mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });

            // Prikazi preview
            audioPreview.src = URL.createObjectURL(blob);
            audioPreview.classList.remove('d-none');

            // Stavi go blob vo file input preku DataTransfer
            const file = new File([blob], 'snimka.webm', { type: 'audio/webm' });
            const dt = new DataTransfer();
            dt.items.add(file);
            audioFileInput.files = dt.files;

            // Pokazi label deka e podgotveno
            recordedLabel.classList.remove('d-none');

            // Stoppi gi site tracks od mikrofonot
            stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();
        startBtn.disabled = true;
        statusDiv.classList.remove('d-none');
        recordedLabel.classList.add('d-none');

        seconds = 0;
        timerSpan.textContent = '00:00';
        timerInterval = setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            timerSpan.textContent = `${mins}:${secs}`;
        }, 1000);

    } catch (err) {
        alert('Greshka pri pristap do mikrofon: ' + err.message);
    }
});

stopBtn.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        clearInterval(timerInterval);
        startBtn.disabled = false;
        statusDiv.classList.add('d-none');
    }
});

form.addEventListener('submit', (e) => {
    if (audioFileInput.files.length === 0) {
        e.preventDefault();
        alert('Prikachi audio fajl ili snimi preku mikrofon!');
        return;
    }
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Procesiranje... (moze da trae 1-2 min)';
});
</script>

<style>
    .btn-lg { min-width: 220px; }
</style>
{% endblock %}
